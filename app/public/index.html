<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>我的项目资料台</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/workspace.css"><link rel="stylesheet" href="/design.css"><link rel="stylesheet" href="/navigation-design.css"><link rel="stylesheet" href="/progress-management.css"><link rel="stylesheet" href="/timeline-design.css"><link rel="stylesheet" href="/lifecycle.css"><link rel="stylesheet" href="/notes.css"><link rel="stylesheet" href="/document-search.css"><link rel="stylesheet" href="/spreadsheet-preview.css"><link rel="stylesheet" href="/word-preview.css"><script src="/design.js" defer></script><script src="/files-ui.js" defer></script><script src="/navigation.js" defer></script><script src="/todos.js" defer></script><script src="/progress.js" defer></script><script src="/workspace.js" defer></script><script src="/followup.js" defer></script><script src="/lifecycle.js" defer></script><script src="/notes.js" defer></script><script src="/document-search.js" defer></script><script src="/spreadsheet-preview.js" defer></script><script src="/word-layout-compat.js" defer></script><script src="/word-preview.js" defer></script><script src="/app.js" defer></script></head>
<body><header class="top"><div class="brand"><span class="logo">栈</span><strong>项目资料台</strong></div><button id="sidebar-toggle" class="icon-button" aria-label="收起侧栏" aria-expanded="true"></button><div class="global-find"><input id="global-file-search" type="search" aria-label="全局搜索文件" placeholder="搜索资料、图号或标签…"><kbd>Ctrl K</kbd><button id="global-find-button" aria-label="找资料">⌕</button></div><span id="connection" role="status">连接中</span><button id="refresh" class="icon-button">刷新</button><button id="theme-toggle" class="icon-button" aria-label="切换深色"></button><button id="stop-service" title="停止本机后台服务"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9M6.4 5.7a8 8 0 1 0 11.2 0"/></svg><span>停止运行</span></button></header>
<div id="error" role="alert" hidden></div>
<div class="shell"><aside class="sidebar" aria-label="工作区"><div class="workspace-caption">我的空间</div><nav class="workspace-nav" aria-label="功能导航"><button id="progress-tab" class="board-entry progress-entry" aria-pressed="false"><span></span><span class="nav-label">项目进度</span><span id="progress-count"></span></button><button id="board-tab" class="board-entry" aria-pressed="false"><span></span><span class="nav-label">全部待办</span><span id="board-count"></span></button><button id="files-tab" class="board-entry" aria-pressed="false"><span></span><span class="nav-label">找资料</span></button></nav><section id="sidebar-utilities" class="sidebar-utilities" aria-label="资料快捷访问"><div class="utility-tabs" role="group" aria-label="快捷资料范围"><button data-utility-tab="recent" aria-pressed="true">最近查看</button><button data-utility-tab="pinned" aria-pressed="false">常用资料</button></div><div id="sidebar-utility-list"></div><button id="sidebar-utility-more" hidden>显示更多</button></section><div class="workspace-footer"><span class="workspace-avatar">我</span><div><strong>个人工作空间</strong><small>本机资料库</small></div></div></aside>
<div class="workarea"><aside id="library-panel" class="library-panel" aria-label="资料目录" hidden><button id="board-directory-toggle" class="board-directory-toggle" aria-expanded="false" aria-controls="library-navigation">浏览文件夹 <span>⌄</span></button><div id="library-navigation"><div class="library-heading"><h2>资料库</h2><button id="nav-collapse" title="收起全部目录" aria-label="收起全部目录">收起</button></div><button id="library-all" class="library-all" aria-pressed="false"><span></span>全部资料</button><div id="directory-controls" class="directory-controls"><input id="directory-search" type="search" placeholder="定位文件夹…" aria-label="搜索本地目录"><div id="nav-shortcuts" hidden></div></div><div id="root-path" hidden></div><nav id="projects" aria-label="本地目录树"></nav></div></aside>
<main><header class="project-head"><div><h1 id="project-title">读取中</h1><p id="project-path" class="muted"></p></div><button id="copy-link">复制链接</button></header>
<label class="next-line"><span>下一步</span><input id="project-next" placeholder="记一件待办…" maxlength="500"><span id="next-saved" class="muted"></span></label>
<div class="toolbar"><div class="tabs" role="group" aria-label="资料组织方式"><button id="folder-tab" aria-pressed="true">资料</button><button id="timeline-tab" aria-pressed="false">时间线</button></div><input type="search" id="search" aria-label="搜索文件、标签、备注" placeholder="搜索"></div>
<section id="resource-global-view" hidden><div id="resource-global-content"></div></section><section id="board-view" hidden>
 <div class="board-overview"><span id="board-date"></span><span id="board-summary"></span></div>
 <form id="todo-quick" class="todo-quick"><input id="todo-quick-title" maxlength="500" required aria-label="新待办" placeholder="记一件要做的事…"><button class="primary" type="submit">＋ 添加</button></form>
 <div class="board-tools"><div id="todo-filters" class="tabs" role="group" aria-label="待办筛选"><button data-todo-filter="all" aria-pressed="true">全部</button><button data-todo-filter="today" aria-pressed="false">今天</button><button data-todo-filter="overdue" aria-pressed="false">逾期</button></div><select id="todo-project-filter" aria-label="按项目筛选"></select><input id="todo-search" type="search" placeholder="搜索待办" aria-label="搜索待办"></div>
 <div id="todo-lanes" class="todo-lanes"></div>
 <details id="next-inbox" class="next-inbox" open><summary>项目下一步 <span id="next-count"></span></summary><div id="next-inbox-list"></div></details>
</section>
<section id="progress-view" hidden>
 <div id="progress-overview"><div class="progress-top"><div class="progress-summary" id="progress-summary"></div><button id="new-progress" class="primary">＋ 新建项目</button></div><div class="progress-filterbar"><input id="progress-search" type="search" placeholder="搜索项目" aria-label="搜索项目"><label class="check"><input id="progress-attention" type="checkbox">需关注</label></div><div id="progress-project-list"></div></div>
 <div id="progress-detail" hidden><div class="progress-top"><button id="progress-back" class="quiet">‹ 全部项目</button><div class="actions"><button id="progress-folder">项目资料 ↗</button><button id="progress-settings">项目设置</button></div></div><div id="progress-detail-summary" class="progress-detail-summary"></div><div class="tabs progress-tabs" role="group" aria-label="项目管理视图"><button data-progress-subview="schedule" aria-pressed="true">节点计划</button><button data-progress-subview="demand" aria-pressed="false">需求分配</button><button data-progress-subview="history" aria-pressed="false">变更记录</button><span id="progress-saved" role="status"></span></div><div id="progress-schedule"><div id="progress-stage-table" class="progress-table-wrap"></div><form id="progress-add-stage" class="progress-add-line"><input id="progress-stage-title" required maxlength="200" placeholder="新增节点…" aria-label="新节点名称"><button type="submit">＋ 添加节点</button></form></div><div id="progress-demand" hidden><div id="progress-demand-table" class="progress-table-wrap"></div><form id="progress-add-demand" class="progress-add-line"><input id="progress-demand-party" required maxlength="120" placeholder="新增需求方…" aria-label="新需求方名称"><button type="submit">＋ 添加需求</button></form><label class="progress-total-note">合计备注<input id="progress-demand-note" maxlength="1000" placeholder="备注"></label></div><div id="progress-history" hidden></div></div>
</section>
<section id="folder-view"><div class="folder-tip"><button id="choose-files">存入文件</button><input type="file" id="file-picker" multiple hidden></div><div id="folder-groups"></div></section>
<section id="timeline-view" hidden>
 <div class="timeline-head"><h2>资料时间线</h2><div class="timeline-controls"><label class="date-basis">日期<select id="timeline-basis"><option value="birthtime">创建日期</option><option value="mtime">修改日期</option></select></label><label class="date-basis">排序<select id="timeline-order"><option value="desc">最新在前</option><option value="asc">最早在前</option></select></label></div></div>
 <details class="date-help"><summary>日期说明</summary><p>系统记录日期；复制或解压可能改变创建时间。</p></details>
 <div id="file-timeline"></div>
 <details class="manual-nodes" id="manual-nodes"><summary>项目节点<span id="manual-count"></span></summary><div class="timeline-head"><button id="add-node">＋ 新建节点</button></div><form id="node-form" class="panel" hidden><h2 id="node-form-title">新建节点</h2><div class="form-grid"><label>名称<input id="node-title" required maxlength="100" placeholder="检具评审"></label><label>日期<input id="node-date" type="date"></label><label>进度<select id="node-status"><option>待开始</option><option>进行中</option><option>待确认</option><option>已完成</option></select></label><label class="span">备注<textarea id="node-note" rows="2" maxlength="1000"></textarea></label><label class="span">关联资料<input id="link-search" type="search" placeholder="搜索文件"></label><div id="node-files" class="span checkbox-list"></div></div><div class="actions"><button type="submit" class="primary">保存</button><button type="button" id="cancel-node">取消</button></div></form><div id="timeline-list"></div></details>
</section>
</main></div></div>
<dialog id="progress-project-dialog"><form id="progress-project-form"><div class="dialog-head"><h2 id="progress-project-dialog-title">新建项目</h2><button type="button" id="progress-project-close">关闭</button></div><label>项目名称<input id="progress-name" required maxlength="160" placeholder="填写项目名称"></label><label>本地目录<select id="progress-directory"></select></label><label id="progress-template-label">起始计划<select id="progress-template"><option value="blank">空白计划</option><option value="sample">样品交付模板 · 8 个节点</option></select></label><label>需求数量单位<input id="progress-unit" required maxlength="12" value="套"></label><p id="progress-project-error" role="alert"></p><div class="actions"><button type="submit" class="primary">保存</button></div></form></dialog>
<dialog id="progress-stage-dialog"><div class="dialog-head"><div><h2 id="progress-stage-dialog-title">节点资料</h2><p id="progress-file-location" class="muted"></p></div><button id="progress-stage-close">关闭</button></div><div class="progress-stage-tools"><button id="progress-stage-up">↑ 上移</button><button id="progress-stage-down">↓ 下移</button><button id="progress-stage-todo">加入待办</button></div><div class="gallery-toolbar"><div class="tabs" aria-label="资料范围"><button data-gallery-scope="linked">关联资料 <span id="gallery-linked-count"></span></button><button data-gallery-scope="all">项目资料</button></div><input id="progress-file-search" type="search" placeholder="搜索文件名或目录" aria-label="搜索节点关联文件"><select id="gallery-type" aria-label="文件类型"><option value="">全部类型</option><option value="image">图片</option><option value="video">视频</option><option value="pdf">PDF</option><option value="document">文档 / 表格</option><option value="model">模型</option></select><div class="tabs" aria-label="文件显示方式"><button data-gallery-layout="grid">缩略图</button><button data-gallery-layout="list">列表</button></div></div><div class="file-explorer"><aside id="progress-file-folders"></aside><section><div id="progress-file-breadcrumb"></div><div id="progress-stage-links"></div><div id="progress-gallery-pagination"></div></section></div><div id="progress-file-count" class="muted"></div><p id="progress-stage-error" role="alert"></p><div class="actions"><button id="progress-save-links" class="primary">保存资料关联</button><button id="progress-delete-stage">删除节点</button></div></dialog>
<dialog id="todo-dialog"><form id="todo-form"><div class="dialog-head"><h2>编辑待办</h2><button id="todo-close" type="button">关闭</button></div><label>待办<input id="todo-title" required maxlength="500"></label><div class="todo-fields"><label class="span">所属目录<select id="todo-project"></select></label><label>进度<select id="todo-status"><option value="todo">待办</option><option value="doing">进行中</option><option value="waiting">等待中</option><option value="done">已完成</option></select></label><label>截止日期<input id="todo-due" type="date"></label></div><div class="todo-flags"><label class="check"><input id="todo-today" type="checkbox">今天做</label><label class="check"><input id="todo-priority" type="checkbox">优先</label></div><label>备注<textarea id="todo-note" rows="3" maxlength="3000"></textarea></label><details class="todo-related"><summary>关联文件 <span id="todo-link-count"></span></summary><input id="todo-file-search" type="search" placeholder="搜索文件" aria-label="搜索待办关联文件"><div id="todo-file-list" class="checkbox-list"></div></details><p id="todo-form-error" role="alert"></p><div class="actions"><button class="primary" id="todo-save" type="submit">保存</button><button id="todo-go-progress" type="button" hidden>项目节点 ↗</button><button id="todo-delete" type="button">删除</button></div></form></dialog>
<dialog id="file-dialog"><div class="dialog-head"><div><h2 id="file-title"></h2><p id="file-path" class="muted"></p></div><button id="close-file" aria-label="关闭文件详情">关闭</button></div><div class="file-work"><section><div class="preview-actions"><button id="open-file">打开</button><button id="open-folder">所在目录</button></div><div id="preview" class="preview"></div></section><aside class="annotations"><label>标签<input id="file-tags" placeholder="用逗号分隔" maxlength="450"></label><label>备注<textarea id="file-note" rows="7" maxlength="3000" placeholder="记点什么…"></textarea></label><label class="check"><input id="file-pin" type="checkbox">常用</label><div class="actions"><button class="primary" id="save-file">保存</button><span id="file-saved" class="muted"></span></div><div id="file-links" class="muted"></div></aside></div></dialog>
<dialog id="import-dialog"><div class="dialog-head"><h2>存入文件</h2><button id="cancel-import">取消</button></div><p class="muted">保存到</p><p id="import-target"></p><p class="hint">保留原文件，同名另存。</p><div id="import-list"></div><p id="import-status" role="status"></p><div class="actions"><button class="primary" id="confirm-import">保存</button></div></dialog>
<dialog id="service-stopped" aria-labelledby="service-stop-title"><div class="service-stop-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9M6.4 5.7a8 8 0 1 0 11.2 0"/></svg></div><h2 id="service-stop-title">已停止运行</h2><p id="service-stop-message" role="status"></p><p id="service-draft-notice" hidden>本页未提交的内容仍保留，重新连接后可继续编辑。</p><span class="launcher-label">启动文件</span><p id="launcher-path"></p><div class="actions"><button id="copy-launcher-path">复制启动路径</button><button id="reconnect-service" class="primary">重新连接</button></div></dialog><footer><span id="scan-status">连接中</span><span>本地</span></footer><div id="toast" role="status" aria-live="polite"></div>
</body></html>
